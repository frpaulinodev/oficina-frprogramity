<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Lead Finder</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='10' fill='%231d4ed8'/><circle cx='12' cy='12' r='4' fill='%2334d399'/></svg>" />
    <link rel="stylesheet" href="/assets/app.css" />
    <style>#glf-boot{font-family:Segoe UI,system-ui,sans-serif;background:#050c19;color:#cbd5e1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}#glf-boot .c{max-width:560px;line-height:1.6}#glf-boot b{color:#fff}#glf-boot code{background:#12233f;padding:2px 6px;border-radius:4px;color:#34d399}</style>
  </head>
  <body>
    <div id="root"><div id="glf-boot"><div class="c">Cargando Global Lead Finder…</div></div></div>
    <script>
      (function () {
        var help = function (title) {
          var el = document.getElementById("glf-boot");
          if (!el) return;
          el.innerHTML = '<div class="c"><h2 style="color:#fff;margin:0 0 12px">' + title + '</h2>' +
            '<p>La aplicación necesita su servidor. Para abrirla:</p><ol>' +
            '<li>Cierra esta pestaña.</li>' +
            '<li>En la carpeta <b>MY APP DE TRABAJO</b>, haz doble clic en <code>INICIAR.bat</code>.</li>' +
            '<li>Espera a que la ventana negra diga <b>Global Lead Finder → http://127.0.0.1:8000</b>; el navegador se abrirá solo.</li></ol>' +
            '<p>Si la ventana negra se cierra o muestra un error, instala Python desde <b>python.org</b> marcando “Add python.exe to PATH”, o envía una captura de esa ventana.</p></div>';
        };
        if (location.protocol === "file:") { help("Este archivo no se abre directamente"); return; }
        setTimeout(function () { if (document.getElementById("glf-boot")) help("La aplicación no terminó de cargar"); }, 8000);
      })();
    </script>
    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
