<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FRPROGRAMITY · Oficina Virtual</title>
  <meta name="description" content="Oficina virtual de FRPROGRAMITY: un equipo de agentes de IA que planifica, programa, prueba y entrega webs, software y proyectos de mecatrónica, con laboratorio de Arduino, robótica y algoritmos." />
  <meta name="theme-color" content="#1c1410" />
  <meta property="og:title" content="FRPROGRAMITY · Oficina Virtual" />
  <meta property="og:description" content="Un equipo de IA que crea webs, software y robots con Arduino. Desarrollado por FRPROGRAMITY." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="style.css" />
  <!-- Tailwind local (sin esperar a la red) y three.js r128 -->
  <script src="tailwind.js"></script>
  <script>
    // Si la copia local de Tailwind no aplica estilos, se usa la oficial como respaldo
    document.addEventListener('DOMContentLoaded', function () {
      setTimeout(function () {
        var probe = document.createElement('div');
        probe.className = 'grid';
        document.body.appendChild(probe);
        var ok = getComputedStyle(probe).display === 'grid';
        probe.remove();
        if (!ok) { var s = document.createElement('script'); s.src = 'https://cdn.tailwindcss.com'; document.head.appendChild(s); }
      }, 400);
    });
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <!-- El orden importa: company.js define la empresa; de office-config.js a panel.js va la oficina (antes script.js); el resto añade sistemas -->
  <script src="company.js" defer></script>
  <script src="office-config.js" defer></script>
  <script src="scene-setup.js" defer></script>
  <script src="scene-furniture.js" defer></script>
  <script src="scene-office.js" defer></script>
  <script src="agents-life.js" defer></script>
  <script src="recruitment.js" defer></script>
  <script src="panel.js" defer></script>
  <script src="perf.js" defer></script>
  <script src="avatars.js" defer></script>
  <script src="ranks.js" defer></script>
  <script src="projects.js" defer></script>
  <script src="offices.js" defer></script>
  <script src="ai.js" defer></script>
  <script src="codegen.js" defer></script>
  <script src="voice.js" defer></script>
  <script src="schedule.js" defer></script>
  <script src="clients.js" defer></script>
  <script src="interviews.js" defer></script>
  <script src="music.js" defer></script>
  <script src="assistant.js" defer></script>
  <script src="city.js" defer></script>
  <script src="director3d.js" defer></script>
  <script src="teamwork.js" defer></script>
  <script src="lab-data.js" defer></script>
  <script src="lab-engine.js" defer></script>
  <script src="labroom.js" defer></script>
  <script src="ui.js" defer></script>
  <script src="fixes.js" defer></script>
  <script src="legal.js" defer></script>
</head>
<body>
  <!-- Pantalla de carga -->
  <div id="loader">
    <div class="loader-card">
      <div class="loader-logo"></div>
      <div id="loader-brand" class="text-lg font-extrabold tracking-tight text-white">Oficina Virtual</div>
      <div id="loader-text" class="text-[11px] text-slate-400 mt-1">Cargando…</div>
      <div class="loader-track"><div id="loader-bar"></div></div>
    </div>
  </div>

  <div id="canvas-container" title="Arrastra para girar · Rueda para zoom · Clic en una sala o en un empleado · V: modo Director 3D"></div>
  <div id="vignette"></div>
  <div id="labels-overlay"></div>

  <!-- Cabecera compacta -->
  <header class="fixed top-2.5 left-2.5 right-2.5 z-20 flex items-start justify-between gap-2 pointer-events-none">
    <div class="glass hide-3d pointer-events-auto flex items-center gap-2.5 pl-1.5 pr-3 py-1.5 rounded-2xl">
      <div id="brand-logo" class="brand-logo">FRP</div>
      <div class="leading-tight">
        <div class="flex items-center gap-1.5">
          <span id="brand-name" class="font-bold text-[13px] tracking-tight text-white">FRPROGRAMITY</span>
          <span class="live-dot" title="Oficina en funcionamiento"></span>
        </div>
        <p id="brand-sub" class="text-[10px] text-slate-400">Oficina virtual · equipo IA</p>
      </div>
    </div>

    <!-- Reloj + horario + cinta en vivo -->
    <div class="glass pointer-events-auto flex items-center gap-2 pl-3 pr-1.5 py-1.5 rounded-2xl min-w-0">
      <div class="leading-tight text-center">
        <div id="hud-clock" class="font-mono font-bold text-[15px] text-white tabular-nums">--:--:--</div>
        <div id="hud-date" class="text-[9px] text-slate-400 capitalize">—</div>
      </div>
      <button id="hud-sched" onclick="toggleDockPanel('schedule')" class="sched-chip" title="Horario de la empresa">🗓️ Horario</button>
      <div class="hide-3d hidden xl:flex items-center w-[360px] h-7 rounded-xl overflow-hidden bg-slate-950/60 border border-slate-800">
        <span class="px-2 h-full flex items-center text-[9px] font-mono font-bold text-rose-300 bg-rose-500/10 border-r border-slate-800 shrink-0">● EN VIVO</span>
        <div class="overflow-hidden flex-1"><div id="ticker-content" class="ticker-track text-[10px] font-mono items-center"></div></div>
      </div>
    </div>

    <div class="hide-3d pointer-events-auto flex items-center gap-1.5">
      <button id="settings-btn" onclick="toggleSettings()" class="glass icon-pill" title="Vista y gráficos">⚙</button>
      <button onclick="toggleSidePanel()" class="glass icon-pill" title="Mostrar u ocultar el panel">◫</button>
    </div>
  </header>

  <!-- Menú de ajustes -->
  <div id="settings-pop" class="glass hidden fixed top-16 right-2.5 z-30 w-64 rounded-2xl p-2.5 space-y-2.5">
    <label class="block">
      <span class="text-[10px] text-slate-400">📷 Vista de cámara</span>
      <select id="cam-select" onchange="setCameraPreset(this.value)" class="nice-select field mt-1">
        <option value="overview">🏢 Oficina completa</option>
      </select>
    </label>
    <div>
      <div class="flex items-center justify-between"><span class="text-[10px] text-slate-400">✨ Calidad gráfica</span><span id="fps-chip" class="text-[10px] font-mono tabular-nums text-slate-500">-- FPS</span></div>
      <div class="flex gap-1 mt-1">
        <button data-quality="baja" onclick="setGraphicsQuality('baja')" class="gfx-btn seg flex-1">Baja</button>
        <button data-quality="media" onclick="setGraphicsQuality('media')" class="gfx-btn seg flex-1">Media</button>
        <button data-quality="alta" onclick="setGraphicsQuality('alta')" class="gfx-btn seg flex-1">Alta</button>
      </div>
    </div>
    <div>
      <span class="text-[10px] text-slate-400">🌗 Cielo</span>
      <div class="flex gap-1 mt-1">
        <button data-tod="auto" onclick="setTimeOfDay('auto')" class="tod-btn seg flex-1">🕒 Auto</button>
        <button data-tod="dia" onclick="setTimeOfDay('dia')" class="tod-btn seg flex-1">☀️ Día</button>
        <button data-tod="noche" onclick="setTimeOfDay('noche')" class="tod-btn seg flex-1">🌙 Noche</button>
      </div>
    </div>
    <label class="flex items-center gap-1.5 text-[10px] text-slate-300 cursor-pointer"><input type="checkbox" checked onchange="document.body.classList.toggle('no-room-tags', !this.checked)" class="accent-cyan-400"> Mostrar nombres de las salas</label>
    <label class="hidden"><select id="office-select"></select></label>
  </div>

  <!-- Panel del Director (abajo a la izquierda) -->
  <section id="director-panel" class="glass hide-3d fixed bottom-3 left-2.5 z-20 w-[calc(100vw-1.25rem)] sm:w-[340px] rounded-2xl p-2">
    <div class="flex items-center gap-1.5 mb-1.5">
      <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse shrink-0"></span>
      <span id="director-title" class="text-[11px] font-semibold text-white truncate">Tú · Director</span>
      <span id="user-zone-badge" class="text-[9px] font-mono px-1.5 py-0.5 rounded-full bg-cyan-500/15 text-cyan-300 border border-cyan-500/30 truncate max-w-[120px]">Dirección</span>
      <select id="director-quick" onchange="if (this.value) moveDirectorTo(this.value); this.value = ''" class="nice-select ml-auto text-[10px] bg-slate-900 border border-slate-700 rounded-lg px-1.5 py-0.5 text-slate-200 max-w-[110px]" title="Mover al Director"></select>
    </div>
    <form onsubmit="sendSpatialDirective(event)" class="flex gap-1.5">
      <input id="spatial-input" type="text" maxlength="600" autocomplete="off" placeholder="Ordena algo: «crea una web para una pizzería»…"
        class="flex-1 min-w-0 bg-slate-900/90 border border-slate-700/80 rounded-xl px-2.5 py-1.5 text-[11px] text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400" />
      <button type="submit" class="px-2.5 py-1.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold text-[11px] transition">Enviar</button>
    </form>
  </section>

  <!-- Dock inferior -->
  <nav id="dock" class="glass hide-3d fixed bottom-3 left-1/2 -translate-x-1/2 z-20 flex items-center gap-0.5 p-1 rounded-2xl">
    <button class="dock-btn" data-panel="assistant" onclick="toggleDockPanel('assistant')" title="Tu asistente IA"><span>🤖</span><small id="dock-assistant-label">Asistente</small></button>
    <button class="dock-btn" data-panel="clients" onclick="toggleDockPanel('clients')" title="Clientes y llamadas"><span>🤝</span><small>Clientes</small></button>
    <button class="dock-btn" onclick="dockMeeting()" title="Reunión de voz con el equipo"><span>🎙️</span><small>Reunión</small></button>
    <button class="dock-btn" data-panel="schedule" onclick="toggleDockPanel('schedule')" title="Horario"><span>🗓️</span><small>Horario</small></button>
    <button class="dock-btn relative" data-panel="music" onclick="toggleDockPanel('music')" title="Música"><span>🎧</span><small>Música</small><i id="dock-music-dot" class="music-dot hidden"></i></button>
    <button id="dock-3d" class="dock-btn" onclick="toggleDirector3D()" title="Modo Director 3D (V)"><span>🎮</span><small>Modo 3D</small></button>
  </nav>

  <!-- Paneles del dock -->
  <div id="dock-panels" class="fixed z-30 bottom-[76px] left-1/2 -translate-x-1/2 w-[calc(100vw-1.25rem)] sm:w-[360px] pointer-events-none">
    <div id="dock-panel-assistant" class="dock-panel glass hidden"></div>
    <div id="dock-panel-clients" class="dock-panel glass hidden"></div>
    <div id="dock-panel-schedule" class="dock-panel glass hidden"></div>
    <div id="dock-panel-music" class="dock-panel glass hidden"></div>
  </div>

  <!-- Sala de llamada (reuniones, clientes, asistente) -->
  <div id="voice-room" class="glass hidden fixed z-30 bottom-[76px] left-1/2 -translate-x-1/2 w-[calc(100vw-1.25rem)] sm:w-[380px] rounded-2xl overflow-hidden"></div>

  <!-- Modo Director 3D -->
  <div id="dir3d-hint" class="hidden fixed z-20 top-16 left-1/2 -translate-x-1/2 glass rounded-xl px-3 py-1.5 text-[10px] text-slate-300 text-center">
    <b class="text-white">Modo Director 3D</b> · WASD moverte · Shift correr · Arrastra para mirar · <b>E</b> hablar · <b>Esc</b> salir
  </div>
  <div id="dir3d-prompt" class="hidden fixed z-20 bottom-24 left-1/2 -translate-x-1/2 px-3 py-1 rounded-lg bg-slate-950/85 border border-cyan-400/40 text-[11px] text-cyan-100 font-semibold"></div>
  <button id="dir3d-exit" onclick="toggleDirector3D(false)" class="fixed z-20 top-2.5 right-2.5 glass icon-pill" title="Salir del modo 3D (Esc)">✕</button>

  <!-- Panel derecho -->
  <aside id="side-panel" class="glass hide-3d fixed top-[62px] right-2.5 bottom-[76px] z-20 w-[360px] max-w-[calc(100vw-1.25rem)] rounded-2xl flex flex-col overflow-hidden">
    <div class="px-2 py-1.5 border-b border-slate-800/90 flex items-center gap-1">
      <nav class="flex items-center gap-0.5 flex-wrap flex-1">
        <button id="tab-operations" onclick="switchTab('operations')" class="tab-btn tab-active" title="Resumen de la oficina">🏢 <span class="tab-label">Oficina</span></button>
        <button id="tab-projects" onclick="switchTab('projects')" class="tab-btn" title="Proyectos">📁 <span class="tab-label">Proyectos</span> <span id="projects-count" class="tab-badge bg-amber-500/25 text-amber-100 border-amber-400/40 hidden">0</span></button>
        <button id="tab-team" onclick="switchTab('team')" class="tab-btn" title="Equipo">👥 <span class="tab-label">Equipo</span> <span id="team-count" class="tab-badge bg-amber-500/25 text-amber-100 border-amber-400/40 hidden"></span></button>
        <button id="tab-recruit" onclick="switchTab('recruit')" class="tab-btn" title="Vacantes y entrevistas">🎯 <span class="tab-label">Talento</span> <span id="recruit-count" class="tab-badge bg-violet-500/20 text-violet-200 border-violet-500/30">0</span></button>
        <button id="tab-deliverables" onclick="switchTab('deliverables')" class="tab-btn" title="Entregables">📦 <span id="deliverables-count" class="tab-badge bg-emerald-500/20 text-emerald-300 border-emerald-500/30">0</span></button>
        <button id="tab-offices" onclick="switchTab('offices')" class="tab-btn" title="Empresas de familiares">🏘️</button>
      </nav>
    </div>
    <div id="panel-body" class="flex-1 overflow-y-auto p-2.5 space-y-2.5"></div>
  </aside>

  <!-- Visor de proyectos y entregables (vista previa + código) -->
  <div id="deliverable-modal" class="fixed inset-0 z-40 hidden items-center justify-center p-3 bg-black/75 backdrop-blur-sm" onclick="if (event.target === this) closeDeliverableModal()">
    <div class="w-full max-w-5xl max-h-[92vh] rounded-2xl bg-slate-950 border border-slate-700/90 shadow-2xl flex flex-col overflow-hidden">
      <div class="px-4 py-2.5 border-b border-slate-800 flex items-center justify-between gap-3">
        <div class="min-w-0">
          <div class="flex items-center gap-2">
            <span id="modal-badge" class="text-[10px] font-mono px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 shrink-0">TERMINADO</span>
            <h3 id="modal-title" class="font-bold text-sm text-white truncate">Entregable</h3>
          </div>
          <p id="modal-meta" class="text-[11px] text-slate-400 mt-0.5 truncate"></p>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <button onclick="copyDeliverableContent()" class="hidden sm:inline-block px-2.5 py-1 rounded-lg text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">Copiar resumen</button>
          <button onclick="closeDeliverableModal()" class="px-2.5 py-1 rounded-lg text-xs bg-rose-500/20 hover:bg-rose-500/30 text-rose-200 border border-rose-500/40 transition">Cerrar ✕</button>
        </div>
      </div>
      <div id="modal-content" class="p-3 overflow-y-auto space-y-3 text-xs"></div>
    </div>
  </div>

  <!-- Modal de entrevista -->
  <div id="interview-modal" class="fixed inset-0 z-40 hidden items-center justify-center p-3 bg-black/70 backdrop-blur-sm">
    <div class="w-full max-w-4xl max-h-[90vh] rounded-2xl bg-slate-950 border border-violet-500/40 shadow-2xl flex flex-col overflow-hidden">
      <div class="px-4 py-2.5 border-b border-slate-800 flex items-center justify-between gap-3">
        <div class="min-w-0">
          <div class="flex items-center gap-2">
            <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-violet-500/20 text-violet-200 border border-violet-500/40">ENTREVISTA</span>
            <h3 id="interview-title" class="font-bold text-sm text-white truncate">Candidato</h3>
          </div>
          <p id="interview-meta" class="text-[11px] text-slate-400 mt-0.5"></p>
        </div>
        <button onclick="decideCandidate('later')" class="px-2.5 py-1 rounded-lg text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">Pausar ✕</button>
      </div>
      <div id="interview-content" class="p-4 overflow-y-auto text-xs"></div>
      <div id="interview-actions" class="px-4 py-2.5 border-t border-slate-800 flex flex-wrap items-center gap-2 justify-end"></div>
    </div>
  </div>

  <div id="toast-container" class="fixed top-[62px] left-2.5 z-50 flex flex-col gap-1.5 pointer-events-none max-w-xs"></div>
</body>
</html>
